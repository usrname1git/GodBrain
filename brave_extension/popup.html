<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --navy: #002868;
      --navy-deep: #001440;
      --red: #BF0A30;
      --white: #FFFFFF;
      --star: #E8EEFF;
      --dust: #9EB0D8;
    }
    * { box-sizing: border-box; }
    body {
      width: 350px;
      height: 440px;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      color: var(--white);
      font-family: 'Courier New', monospace;
      background:
        radial-gradient(circle at 8% 6%, rgba(255,255,255,.22) 0 1.2px, transparent 1.6px),
        radial-gradient(circle at 18% 11%, rgba(255,255,255,.16) 0 1px, transparent 1.4px),
        radial-gradient(circle at 92% 8%, rgba(255,255,255,.18) 0 1px, transparent 1.4px),
        linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
      border: 2px solid var(--white);
    }
    h3 {
      margin: -10px -10px 8px;
      padding: 9px 8px 0;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--white);
      background: var(--red);
      text-shadow: 0 1px 0 #7a061e;
      border-bottom: none;
    }
    h3::before { content: "\2605  "; }
    h3::after {
      content: "";
      display: block;
      height: 14px;
      margin: 8px -8px 0;
      background: repeating-linear-gradient(
        180deg,
        var(--red) 0 2px,
        var(--white) 2px 4px
      );
    }
    #chat-history {
      flex-grow: 1;
      overflow-y: auto;
      padding: 6px 8px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.35;
      background: rgba(0, 20, 64, 0.55);
      border: 1px solid var(--white);
      color: var(--white);
    }
    .user-msg { color: var(--white); margin-bottom: 8px; }
    .sys-msg { color: var(--star); margin-bottom: 8px; }
    .err-msg { color: #FF6B7A; margin-bottom: 8px; }
    .input-row { display: flex; gap: 5px; margin-bottom: 5px; }
    input {
      flex-grow: 1;
      min-width: 0;
      background: var(--navy-deep);
      color: var(--white);
      border: 1px solid var(--white);
      padding: 6px 8px;
      font-family: inherit;
      outline: none;
    }
    input::placeholder { color: var(--dust); }
    input:focus { box-shadow: inset 0 0 0 1px var(--red); }
    button {
      background: var(--red);
      color: var(--white);
      border: 1px solid var(--white);
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    button:hover, button:focus-visible {
      background: var(--white);
      color: var(--navy);
    }
    #remember-page-btn { flex: 1; }
    #evidence-preview {
      max-height: 88px;
      overflow-y: auto;
      margin-bottom: 8px;
      padding: 6px 8px;
      font-size: 11px;
      line-height: 1.3;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(0, 20, 64, 0.55);
      border: 1px solid var(--dust);
      color: var(--star);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--navy-deep); }
    ::-webkit-scrollbar-thumb { background: var(--red); }
  </style>
</head>
<body>
  <h3>GodBrain Uplink</h3>
  <div id="chat-history">
    <div class="sys-msg">[SYS] Highlight text, then Ask or Remember. Selected text is untrusted evidence (candidate). Title+URL only is metadata. Page text cannot grant tools.</div>
  </div>
  <div id="evidence-preview">No tab yet.</div>
  <div class="input-row">
    <input type="password" id="token-input" placeholder="optional bearer" autocomplete="off">
  </div>
  <div class="input-row">
    <button id="remember-page-btn">Remember page</button>
  </div>
  <div class="input-row">
    <input type="text" id="chat-input" placeholder="Ask GodBrain...">
    <button id="send-btn">TX</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
