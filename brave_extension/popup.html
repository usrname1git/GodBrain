<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 350px; height: 400px; background-color: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 10px; margin: 0; display: flex; flex-direction: column; border: 1px solid #0f0; }
    h3 { margin: 0 0 10px 0; text-transform: uppercase; text-shadow: 0 0 5px #0f0; text-align: center; border-bottom: 1px solid #030; padding-bottom: 5px; }
    #chat-history { flex-grow: 1; overflow-y: auto; padding: 5px; border: 1px solid #030; margin-bottom: 10px; font-size: 13px; }
    .user-msg { color: #fff; margin-bottom: 8px; }
    .sys-msg { color: #0f0; margin-bottom: 8px; text-shadow: 0 0 2px #0f0; }
    .err-msg { color: #f00; margin-bottom: 8px; }
    .input-row { display: flex; gap: 5px; }
    input { flex-grow: 1; background: #000; color: #0f0; border: 1px solid #0f0; padding: 5px; font-family: inherit; }
    button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 5px 15px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0f0; color: #000; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #001; }
    ::-webkit-scrollbar-thumb { background: #0f0; }
  </style>
</head>
<body>
  <h3>GodBrain Uplink</h3>
  <div id="chat-history">
    <div class="sys-msg">[SYS] Connected to Sovereign Node.</div>
  </div>
  <div class="input-row">
    <input type="text" id="chat-input" placeholder="Query GodBrain...">
    <button id="send-btn">TX</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
