<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GodBrain Sovereign Node</title>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three-spritetext@1.6.5/dist/three-spritetext.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; color: #0f0; }
        #3d-graph { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #0f0;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px #0f0;
            max-width: 300px;
        }
        
        #rag-chat {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #0f0;
            padding: 15px;
            border-radius: 5px;
            width: 350px;
            height: 400px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px #0f0;
        }
        
        h1, h2, h3 { margin-top: 0; text-transform: uppercase; text-shadow: 0 0 5px #0f0; }
        select, input, button {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px;
            margin: 5px 0;
            width: 100%;
            font-family: inherit;
        }
        button { cursor: pointer; text-transform: uppercase; font-weight: bold; }
        button:hover { background: #0f0; color: #000; }
        
        input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            accent-color: #0f0;
        }
        
        #chat-history {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #030;
            font-size: 0.9em;
        }
        .user-msg { color: #fff; margin-bottom: 5px; }
        .sys-msg { color: #0f0; margin-bottom: 10px; text-shadow: 0 0 2px #0f0; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #001100; }
        ::-webkit-scrollbar-thumb { background: #0f0; }
        
        #node-manual {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 70vh;
            background: rgba(0, 20, 0, 0.95);
            border: 2px solid #0f0;
            border-radius: 5px;
            box-shadow: 0 0 20px #0f0;
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
        }
        
        #node-manual-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            cursor: pointer;
            font-weight: bold;
            padding: 5px 10px;
        }
        
        #node-manual-close:hover {
            background: #0f0;
            color: #000;
        }
        
        #node-manual-content {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #030;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="3d-graph"></div>
    
    <div id="overlay">
        <h2>Sovereign Node</h2>
        <div id="stats">Initializing Galaxy...</div>
        
        <h3 style="margin-top: 15px;">Sector Filtering</h3>
        <div id="sector-filters" style="display: flex; flex-direction: column; gap: 5px; font-size: 0.9em; max-height: 200px; overflow-y: auto;">
            Loading sectors from Golden Records...
        </div>
        
        <h3 style="margin-top: 15px;">Target Node</h3>
        <input type="text" id="node-search" placeholder="Search node ID or label..." list="node-list">
        <datalist id="node-list"></datalist>
        <button id="focus-btn">Focus Scanner</button>
    </div>
    
    <div id="rag-chat">
        <h2>Colibri RAG Uplink</h2>
        <div id="chat-history">
            <div class="sys-msg" id="sys-boot">[SYS] /observe inventory. /vram shows the 16 GB Colibri plan. /verify /reject /remember /recall as before.</div>
        </div>
        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
            <button id="observe-btn" style="width: auto; padding: 5px 10px;">Observe</button>
            <button id="vram-btn" style="width: auto; padding: 5px 10px;">VRAM</button>
        </div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="chat-input" placeholder="/remember ...  or ask GodBrain">
            <button id="send-btn" style="width: auto; padding: 5px 15px;">TX</button>
        </div>
    </div>
    
    <div id="node-manual">
        <button id="node-manual-close">X</button>
        <h2 id="node-manual-title">Node Title</h2>
        <div style="font-size: 0.8em; color: #0a0;" id="node-manual-meta">Type: note | Tags: []</div>
        <div id="node-manual-content">Loading...</div>
    </div>

    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            fetch('/api/log', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    message: msg,
                    line: lineNo,
                    col: columnNo,
                    stack: error ? error.stack : ''
                })
            });
            return false;
        };
        let fullData = { nodes: [], links: [], truncated: false, links_truncated: false, generation: '' };
        let graph = null;
        
        // Initialize basic empty graph
        // Create a reusable glowing star texture for extreme GPU efficiency
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.2, 'rgba(100,255,100,0.8)');
        gradient.addColorStop(0.5, 'rgba(0,150,0,0.4)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        const starTexture = new THREE.CanvasTexture(canvas);

        // Inject test error just to make sure logging works
        setTimeout(() => {
            console.error("Test error injection");
        }, 1000);

        const elem = document.getElementById('3d-graph');
        try {
            graph = ForceGraph3D()(elem)
                .graphData(fullData)
                .nodeLabel('title')
                .nodeAutoColorBy('group')
                .nodeThreeObject(node => {
                    const material = new THREE.SpriteMaterial({ 
                        map: starTexture, 
                        color: Math.round(Math.random() * Math.pow(2, 24)),
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        transparent: true
                    });
                    const sprite = new THREE.Sprite(material);
                    const size = Math.log(node.val || 2) * 3 + 2;
                    sprite.scale.set(size, size, 1);
                    return sprite;
                })
                .linkWidth(0.2)
                .linkOpacity(0.1)
                .backgroundColor('#000300')
                .onNodeClick(node => {
                    // Fetch full node details and show manual
                    document.getElementById('node-manual').style.display = 'flex';
                    document.getElementById('node-manual-title').innerText = node.title || node.label || node.id;
                    document.getElementById('node-manual-content').innerText = 'Loading...';
                    
                    fetch('/api/node?id=' + encodeURIComponent(node.id))
                        .then(res => res.json())
                        .then(data => {
                            if (data.error) {
                                document.getElementById('node-manual-content').innerText = data.error;
                                return;
                            }
                            document.getElementById('node-manual-title').innerText = data.title;
                            document.getElementById('node-manual-meta').innerText = 'Type: ' + data.type + ' | Tags: ' + (data.tags ? data.tags.join(', ') : 'none');
                            document.getElementById('node-manual-content').innerText = data.content;
                        })
                        .catch(err => {
                            document.getElementById('node-manual-content').innerText = 'Error loading content: ' + err;
                        });
                        
                    // Also focus camera
                    const distance = 40;
                    const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
                    graph.cameraPosition(
                        { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                        node,
                        1000
                    );
                });
        } catch (e) {
            console.error("Graph init error:", e);
        }

        // Close manual
        document.getElementById('node-manual-close').addEventListener('click', () => {
            document.getElementById('node-manual').style.display = 'none';
        });

        // Optimize physics for huge 45k node galaxy
        try {
            if (graph.d3Force && graph.d3Force('charge')) {
                // Extreme repulsion to break apart the massive 6000+ node Apple/Windows singularity
                graph.d3Force('charge').strength(-200); 
                
                // Force the central nodes to push their children much further away
                if (graph.d3Force('link')) {
                    graph.d3Force('link').distance(150);
                }
            }
        } catch(e) { console.log(e); }

        fetch('/api/graph')
            .then(res => {
                return res.json().catch(() => ({})).then(data => {
                    if (!res.ok) {
                        throw new Error((data && data.error) || ('API returned ' + res.status));
                    }
                    return data;
                });
            })
            .then(data => {
                fullData = {
                    nodes: Array.isArray(data.nodes) ? data.nodes : [],
                    links: Array.isArray(data.links) ? data.links : [],
                    truncated: !!data.truncated,
                    links_truncated: !!data.links_truncated,
                    generation: data.generation || ''
                };
                rebuildSectorFilters(fullData.nodes);
                applyFilter();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('stats').innerText =
                    'ERROR LOADING GALAXY: ' + ((err && err.message) || err);
                const filters = document.getElementById('sector-filters');
                while (filters.firstChild) filters.removeChild(filters.firstChild);
                filters.appendChild(document.createTextNode('Golden Record graph is unavailable.'));
            });

        function rebuildSectorFilters(nodes) {
            const container = document.getElementById('sector-filters');
            const previouslyChecked = new Set(
                Array.from(container.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value)
            );
            const hadCheckboxes = container.querySelectorAll('input[type="checkbox"]').length > 0;
            while (container.firstChild) container.removeChild(container.firstChild);

            const sectors = Array.from(new Set(
                nodes.map(n => n.group).filter(group => typeof group === 'string' && group.length > 0)
            )).sort();
            if (sectors.length === 0) {
                container.appendChild(document.createTextNode(
                    'No Golden Records in this generation. The old macOS/Linux/Rust harvest stays in Mongo collection nodes and is not mixed in. /observe adds this PC as a candidate.'
                ));
                return;
            }
            sectors.forEach(sector => {
                const label = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.value = sector;
                input.checked = !hadCheckboxes || previouslyChecked.has(sector);
                input.addEventListener('change', applyFilter);
                label.appendChild(input);
                label.appendChild(document.createTextNode(' ' + sector));
                container.appendChild(label);
            });
        }
            
        function applyFilter() {
            const checkboxes = document.querySelectorAll('#sector-filters input[type="checkbox"]');
            const selectedSectors = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
            const nodes = Array.isArray(fullData.nodes) ? fullData.nodes : [];
            const links = Array.isArray(fullData.links) ? fullData.links : [];

            let filteredNodes = checkboxes.length === 0
                ? nodes
                : nodes.filter(n => selectedSectors.includes(n.group));
            
            const nodeIds = new Set(filteredNodes.map(n => n.id));
            const filteredLinks = links.filter(l => 
                nodeIds.has(l.source.id || l.source) && nodeIds.has(l.target.id || l.target)
            );
            
            const renderData = { nodes: filteredNodes, links: filteredLinks };

            let stats = 'Golden Records: ' + filteredNodes.length + ' | Edges: ' + filteredLinks.length;
            if (fullData.generation) stats += ' | ' + fullData.generation;
            if (fullData.truncated) stats += ' | truncated';
            if (fullData.links_truncated) stats += ' | links truncated';
            document.getElementById('stats').innerText = stats;
            
            const dataList = document.getElementById('node-list');
            while (dataList.firstChild) dataList.removeChild(dataList.firstChild);
            filteredNodes.forEach(n => {
                const opt = document.createElement('option');
                opt.value = n.id;
                opt.textContent = n.label || n.title || n.id;
                dataList.appendChild(opt);
            });
            
            if (graph) {
                graph.graphData(renderData);
            } else {
                console.error("Graph is null, cannot apply filter");
                document.getElementById('stats').innerText = "ERROR: WebGL Engine failed to initialize.";
            }
        }
        
        try {
            document.getElementById('focus-btn').addEventListener('click', () => {
                const query = document.getElementById('node-search').value;
                if (!graph) return;
                const target = graph.graphData().nodes.find(n =>
                    n.id === query || n.label === query || n.title === query);
                
                if (target) {
                    const distance = 40;
                    const distRatio = 1 + distance/Math.hypot(target.x, target.y, target.z);
                    
                    graph.cameraPosition(
                        { x: target.x * distRatio, y: target.y * distRatio, z: target.z * distRatio },
                        target,
                        3000
                    );
                }
            });
        } catch(e) {}
        
        // Chat UI
        const chatInput = document.getElementById('chat-input');
        const chatHistory = document.getElementById('chat-history');
        const sendBtn = document.getElementById('send-btn');

        // Builds a chat message element without ever parsing untrusted text
        // as HTML. Preserves deliberate line breaks by inserting <br>
        // elements between text nodes rather than injecting markup.
        function appendChatMessage(className, prefix, text, color) {
            const el = document.createElement('div');
            el.className = className;
            if (color) el.style.color = color;

            if (prefix) {
                el.appendChild(document.createTextNode(prefix + ' '));
            }

            const lines = String(text).split('\n');
            lines.forEach((line, index) => {
                if (index > 0) el.appendChild(document.createElement('br'));
                el.appendChild(document.createTextNode(line));
            });

            chatHistory.appendChild(el);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return el;
        }

        function sendMsg() {
            console.log("Chat button clicked!");
            const text = chatInput.value.trim();
            if(!text) return;

            appendChatMessage('user-msg', '[USER]', text);
            chatInput.value = '';

            fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text})
            })
            .then(res => {
                return res.json().catch(() => {
                    throw new Error('Server returned invalid JSON (HTTP ' + res.status + ')');
                }).then(data => {
                    if (!res.ok) {
                        throw new Error((data && data.error) || ('API returned ' + res.status));
                    }
                    return data;
                });
            })
            .then(data => {
                if (data && typeof data.response === 'string') {
                    appendChatMessage('sys-msg', '[SYS]', data.response);
                } else if (data && typeof data.error === 'string') {
                    appendChatMessage('sys-msg', '[ERR]', data.error, 'red');
                } else {
                    appendChatMessage('sys-msg', '[ERR]', 'Malformed server response.', 'red');
                }
            })
            .catch(err => {
                appendChatMessage('sys-msg', '[ERR]', (err && err.message) || 'Connection lost', 'red');
            });
        }
        
        sendBtn.addEventListener('click', sendMsg);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMsg();
        });

        function runSlash(command) {
            chatInput.value = command;
            sendMsg();
        }
        document.getElementById('observe-btn').addEventListener('click', () => runSlash('/observe'));
        document.getElementById('vram-btn').addEventListener('click', () => runSlash('/vram'));

        fetch('/api/status').then(r => r.json()).then(status => {
            const ragReady = status.rag && status.rag.ready;
            const extra = ' | RAG ' + (ragReady ? 'ready' : 'down') +
                ' | coli ' + (status.coli_serve ? 'serve' : 'cold') +
                ' | writes ' + (status.writes_need_token ? 'need bearer' : 'open on loopback');
            const stats = document.getElementById('stats');
            if (stats && stats.innerText && stats.innerText.indexOf('RAG') === -1) {
                stats.innerText += extra;
            }
            const boot = document.getElementById('sys-boot');
            if (boot && !status.writes_need_token) {
                boot.appendChild(document.createElement('br'));
                boot.appendChild(document.createTextNode(
                    '[SYS] GODBRAIN_API_TOKEN is not set. /remember and Shortcuts need no bearer tonight.'
                ));
            }
        }).catch(() => {});
    </script>
</body>
</html>
