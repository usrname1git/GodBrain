[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
cache_path = "cache"
solc_version = "0.8.28"
evm_version = "cancun"
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
via_ir = true

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true
ignore = ["lib/**/*.sol"]
